version: '3.8'

services:
  # Backend API service
  backend:
    build: ./backend
    container_name: ml-tracker-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ml_tracker
      - REDIS_URL=redis://redis:6380/0
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_MODEL=${OPENAI_API_MODEL}
      - OPENAI_API_ORGANIZATION=${OPENAI_API_ORGANIZATION}
      # Definindo diretamente as configurações de email, sem usar variáveis ${...}
      - SMTP_SERVER=smtps.uhserver.com
      - SMTP_PORT=465
      - SMTP_USER=tracker_hp@smstecnologia.com.br
      - SMTP_PASSWORD=@#Pi231179
      - FRONTEND_URL=http://72.60.247.203:3001
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_API_KEY=TGFmSlhKY0ItRGtNRXVmY1YxeDg6bThDUFBwdHlwNkgzTDk4eHJFNHBWUQ==
      - ELASTICSEARCH_CLOUD_URL=https://cce7c968e5f94cb59b5922e251810730.us-central1.gcp.cloud.es.io:443
    depends_on:
      - db
      - redis
      - elasticsearch
    networks:
      - ml-tracker-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend React service
  frontend:
    build: ./frontend
    container_name: ml-tracker-frontend
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
      - WDS_SOCKET_PORT=3001
      - WDS_SOCKET_HOST=72.60.247.203
      - PORT=80
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - DISABLE_ESLINT_PLUGIN=true
      - SKIP_PREFLIGHT_CHECK=true
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
    networks:
      - ml-tracker-network

  # PostgreSQL database
  db:
    image: postgres:15
    container_name: ml-tracker-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ml_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ml-tracker-network

  # Redis for caching and queue
  redis:
    image: redis:7
    container_name: ml-tracker-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ml-tracker-network

  # Elasticsearch for search and analytics
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.0
    container_name: ml-tracker-elasticsearch
    restart: always
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ml-tracker-network

  # Kibana for Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.7.0
    container_name: ml-tracker-kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - ml-tracker-network

  # Nginx for reverse proxy
  nginx:
    image: nginx:alpine
    container_name: ml-tracker-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - ml-tracker-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  ml-tracker-network:
